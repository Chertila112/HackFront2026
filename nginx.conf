server {
    listen 443 ssl;
    server_name hack-analyzer.ddns.net;

    # PEM-сертификат Let's Encrypt монтируется из хоста (см. docker-compose.yml)
    ssl_certificate /etc/letsencrypt/live/hack-analyzer.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hack-analyzer.ddns.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Хэшированные ассеты Vite - кэш навсегда
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback: все маршруты отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
