name: Deploy to Server


on:
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  deploy:
    name: Deploy to Server
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
          
            if [ ! -d /app-front/.git ]; then
              git clone https://github.com/Chertila112/HackFront2026.git /app-front
            fi

            cd /app-front

            DOMAIN=hack-analyzer.ddns.net


            if [ ! -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem ]; then
              command -v certbot >/dev/null 2>&1 || apt-get install -y -qq certbot
              certbot certonly --standalone --non-interactive --agree-tos \
                --register-unsafely-without-email -d $DOMAIN
            fi


            mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            printf '#!/bin/sh\ndocker restart hackback_front >/dev/null 2>&1 || true\n' > /etc/letsencrypt/renewal-hooks/deploy/hackfront-restart.sh
            chmod +x /etc/letsencrypt/renewal-hooks/deploy/hackfront-restart.sh

            git fetch origin
            git reset --hard origin/main

            echo "Собираем новый образ (старый контейнер ещё работает)"
            docker build -t hackback-front .

            docker stop hackback_front || true
            docker rm hackback_front || true
            docker run -d \
              --name hackback_front \
              --restart always \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              hackback-front

            echo "Ждём, пока фронт поднимется"
            for i in $(seq 1 30); do
              if curl -fsS https://$DOMAIN/ | grep -qi '<div id="app">'; then
                echo "Здеплоин"
                exit 0
              fi
              sleep 2
            done

            exit 1
